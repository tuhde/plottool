[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plottool"
version = "0.1.0"
description = "HPGL plotter/cutter tool with serial port support, path optimization, blade offset compensation, preview, and weeding lines"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Till Uhde", email = "till@uhde.com" },
]
requires-python = ">=3.7"
dependencies = [
    "pyserial",
    "numpy",
    "wxPython",
]
classifiers = [
    "Programming Language :: Python :: 3",
"Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.scripts]
plottool = "plottool:main"

[tool.setuptools]
py-modules = ["plottool", "hpgl", "hpglpreview"]
